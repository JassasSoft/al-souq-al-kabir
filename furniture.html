<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>السوق الكبير | الأثاثات والأواني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #fcc963; --dark: #000; --card: #111; --green: #25d366; --header-h: 135px; --premium-bg: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--dark); color: #fff; height: 100vh; overflow: hidden; padding-bottom: 75px; }

        /* 👑 الهيدر الثابت الأصلي (مطابق لملف 1000109401_5.jpg) */
        .fixed-top { position: fixed; top: 0; width: 100%; z-index: 5000; background: var(--dark); border-bottom: 2px solid var(--accent); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .nav-main { height: 75px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        .nav-icon { color: var(--accent); font-size: 1.5rem; cursor: pointer; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .header-titles { text-align: center; flex: 1; }
        .header-titles h1 { color: var(--accent); font-size: 0.85rem; font-weight: 400; letter-spacing: 1px; }
        .header-titles h2 { color: #fff; font-size: 1.25rem; font-weight: 900; line-height: 1.1; }

        /* 🗂️ القائمة الجانبية اليسارية المتطابقة مع الهبوط العمودي (مطابق لملف 1000109368.jpg) */
        .sidebar { position: fixed; top: -100%; left: 0; width: 290px; max-height: 85vh; background: #0c0c0c; z-index: 9000; transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); box-shadow: 5px 10px 30px rgba(0,0,0,0.9); display: flex; flex-direction: column; border-bottom-right-radius: 20px; }
        .sidebar.active { top: 0; }
        
        /* الترويسة الصفراء العلوية للقائمة مع زر الكروس */
        .sidebar-header { background: var(--accent); color: #000; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header h2 { font-size: 1.2rem; font-weight: 900; }
        .sidebar-close { font-size: 1.3rem; cursor: pointer; color: #000; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }

        /* قسم البروفايل المعتمد داخل القائمة الجانبية */
        .sidebar-user-section { padding: 20px 15px; background: #111; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
        .sidebar-user-info { text-align: right; }
        .sidebar-user-info h3 { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
        .sidebar-user-info span { font-size: 0.7rem; color: var(--accent); background: rgba(252,201,99,0.1); padding: 1px 8px; border-radius: 12px; border: 1px solid rgba(252,201,99,0.2); font-weight: 700; }
        .sidebar-avatar-container { position: relative; }
        .sidebar-user-avatar { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 1.4rem; border: 1px solid var(--accent); }
        .status-dot { position: absolute; bottom: 2px; left: 2px; width: 10px; height: 10px; background: #25d366; border-radius: 50%; border: 2px solid #111; }

        /* عناصر القائمة الجانبية على شكل كروت مستديرة الحواف */
        .sidebar-scroll { overflow-y: auto; flex: 1; padding: 15px 12px; display: flex; flex-direction: column; gap: 8px; }
        .sidebar-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; color: #fff; text-decoration: none; background: #161616; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.2s; border: 1px solid rgba(255,255,255,0.02); }
        .sidebar-item-right { display: flex; align-items: center; gap: 10px; }
        .sidebar-item i.item-icon { font-size: 1rem; color: var(--accent); width: 20px; text-align: center; }
        .sidebar-item i.arrow-icon { font-size: 0.8rem; color: #444; }
        .sidebar-item:active { background: #222; }
        .sidebar-item.active { background: #222; border: 1px solid rgba(252,201,99,0.3); }
        .sidebar-item.active span { color: var(--accent); font-weight: 900; }

        /* قسم الروابط السريعة أسفل القائمة */
        .quick-links-title { font-size: 0.75rem; color: #555; text-align: right; padding: 10px 15px 5px 0; font-weight: 700; }
        .sidebar-link { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: #161616; border-radius: 12px; margin: 0 12px 8px 12px; color: #fff; text-decoration: none; font-size: 0.85rem; font-weight: 700; }
        .sidebar-link.logout-link { background: rgba(255,107,107,0.05); border: 1px solid rgba(255,107,107,0.1); }
        .sidebar-link.logout-link span { color: #ff6b6b; }
        .sidebar-link.logout-link i { color: #ff6b6b; }
        
        /* غطاء الخلفية الشفاف الظلي */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 8500; display: none; backdrop-filter: blur(2px); }

        /* 📱 شريط الخانات الأفقي الملون الثابت */
        .brand-strip { height: 60px; background: #0a0a0a; display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 0 10px; gap: 8px; }
        .brand-strip::-webkit-scrollbar { display: none; }
        .chip { padding: 8px 16px; border-radius: 12px; font-size: 0.78rem; color: #fff; white-space: nowrap; cursor: pointer; font-weight: 900; transition: 0.3s; border: 1px solid rgba(255,255,255,0.02); }
        .chip.active { background: var(--accent) !important; color: #000 !important; transform: scale(1.05); border: 1px solid #fff; box-shadow: 0 0 12px rgba(252, 201, 99, 0.4); z-index: 10; }

        /* ألوان الأقسام الفاخرة لتتناسب مع شريط الخانات المطور */
        .btn-all { background: #333; }
        .btn-home { background: #4a148c; } .btn-office { background: #1a237e; } .btn-kitchen { background: #bf360c; } 
        .btn-rugs { background: #004d40; } .btn-decor { background: #880e4f; } .btn-iron { background: #37474f; } 
        .btn-plastic { background: #0d47a1; } .btn-folk { background: #e65100; } .btn-leather { background: #3e2723; }

        /* 🛒 شبكة مصفوفة المنتجات المحكمة الصغيرة */
        main { margin-top: var(--header-h); height: calc(100vh - var(--header-h)); overflow-y: auto; padding-bottom: 30px; scroll-behavior: smooth; }
        .premium-slider { margin: 12px; min-height: 100px; border: 1.5px solid var(--accent); border-radius: 18px; background: var(--premium-bg); position: relative; overflow: hidden; padding: 15px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
        .premium-slider h3 { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 3px; }
        .premium-slider p { font-size: 0.75rem; color: #bbb; }
        .p-bar { position: absolute; bottom: 0; left: 0; height: 3.5px; background: var(--accent); width: 0%; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px; }
        .card { background: var(--card); border: 1px solid #222; border-radius: 18px; padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; min-height: 175px; }
        .card span.emoji { font-size: 2.5rem; display: block; margin: 4px 0; }
        .card h4 { font-size: 0.8rem; font-weight: 700; color: #fff; line-height: 1.3; }
        .price { color: var(--accent); font-weight: 900; font-size: 0.85rem; margin: 6px 0; background: #000; border-radius: 8px; padding: 4px; border: 1px solid #222; }
        .order-btn { background: var(--green); color: #000; padding: 8px; border-radius: 10px; border: none; font-weight: 900; width: 100%; cursor: pointer; font-size: 0.75rem; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 4px; }

        /* 🤖 المساعد الذكي الكلاسيكي ذو البدلة الرسمية والهالة المضيئة (مطابق لملف 1000109401_5.jpg) */
        .bot-trigger { position: fixed; bottom: 90px; right: 15px; width: 65px; height: 65px; background: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 6000; cursor: pointer; border: 1px solid rgba(252,201,99,0.3); box-shadow: 0 0 20px rgba(252,201,99,0.6); }
        .bot-avatar-circle { width: 50px; height: 50px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 1.7rem; }
        
        /* نافذة الدردشة للمساعد */
        .chat-win { position: fixed; bottom: 165px; right: 15px; width: 300px; height: 360px; background: #080808; border: 2px solid var(--accent); border-radius: 20px; display: none; flex-direction: column; z-index: 6001; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
        .chat-header { background: var(--accent); color: #000; padding: 12px 15px; font-weight: 900; display: flex; justify-content: space-between; font-size: 0.85rem; }
        .chat-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #050505; }
        .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.8rem; line-height: 1.4; }
        .msg.bot { background: #1a1a1a; align-self: flex-start; border-right: 3px solid var(--accent); color: #fff; }
        .msg.user { background: var(--accent); color: #000; align-self: flex-end; font-weight: 900; }
        .chat-footer { padding: 8px; background: #080808; display: flex; gap: 6px; border-top: 1px solid #222; }
        .chat-footer input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 10px; outline: none; font-family: 'Cairo'; font-size: 0.8rem; }
        .chat-footer button { background: var(--accent); border: none; width: 38px; border-radius: 10px; cursor: pointer; color: #000; }

        /* 💳 شريط الأزرار السفلي الاحترافي الثابت والراسخ */
        .fixed-bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 9999; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #888; font-size: 0.7rem; cursor: pointer; width: 55px; transition: 0.2s; }
        .nav-item i { font-size: 1.25rem; color: #555; transition: 0.2s; }
        .nav-item:hover, .nav-item.active-nav { color: #fff; }
        .nav-item:hover i, .nav-item.active-nav i { color: var(--accent); }
    </style>
</head>
<body>

    <!-- غطاء الخلفية عند تفعيل القائمة الجانبية -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    
    <!-- 🗂️ القائمة الجانبية اليسارية المتكاملة مع ميزة الهبوط العمودي (مطابق لملف 1000109368.jpg) -->
    <div class="sidebar" id="sidebar">
        <!-- الترويسة الصفراء مع الكروس لإغلاق القائمة -->
        <div class="sidebar-header">
            <h2>السوق الكبير</h2>
            <div class="sidebar-close" onclick="toggleSidebar()"><i class="fas fa-times"></i></div>
        </div>
        
        <!-- بروفايل المطور محمد حبيب المعتمد -->
        <div class="sidebar-user-section">
            <div class="sidebar-user-info">
                <h3>المطور محمد حبيب</h3>
                <span>تاجر معتمد</span>
            </div>
            <div class="sidebar-avatar-container">
                <div class="sidebar-user-avatar"><i class="fas fa-user-tie"></i></div>
                <div class="status-dot"></div>
            </div>
        </div>

        <!-- كروت الأقسام المنفصلة داخل القائمة الجانبية -->
        <div class="sidebar-scroll" id="sidebarMenu"></div>

        <!-- روابط سريعة المضافة بأسفل القائمة -->
        <div class="quick-links-title">روابط سريعة</div>
        <a href="dashboard.html" class="sidebar-link">
            <div class="sidebar-item-right"><i class="fas fa-sliders-h item-icon" style="color: #fcc963;"></i><span>لوحة تحكم التجار</span></div>
            <i class="fas fa-angle-left arrow-icon"></i>
        </a>
        <a href="#" class="sidebar-link logout-link" onclick="logout()">
            <div class="sidebar-item-right"><i class="fas fa-sign-out-alt"></i><span>تسجيل الخروج</span></div>
            <i class="fas fa-angle-left arrow-icon"></i>
        </a>
    </div>

    <!-- 👑 هيدر التطبيق المعتمد (اليمين: رجوع / اليسار: قائمة جانبية) -->
    <header class="fixed-top">
        <div class="nav-main">
            <!-- 🔗 تم تعديل زر الرجوع ليوجه مباشرة إلى الصفحة الرئيسية الفعالة index.html -->
            <a href="index.html" class="nav-icon"><i class="fas fa-arrow-right"></i></a>
            <div class="header-titles"><h1>السوق الكبير</h1><h2>الأثاثات والأواني</h2></div>
            <!-- زر فتح القائمة الجانبية اليسارية إلى اليسار تماماً -->
            <div class="nav-icon" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        </div>
        <div class="brand-strip" id="brandStrip"></div>
    </header>

    <main>
        <div class="premium-slider">
            <div class="p-content" id="pContent"></div>
            <div class="p-bar" id="pBar"></div>
        </div>
        <div class="grid" id="mainGrid"></div>
    </main>

    <!-- 🤖 المساعد الذكي الأصلي الدائري بالهالة والمظهر الرسمي (مطابق لملف 1000109401_5.jpg) -->
    <div class="bot-trigger" onclick="toggleChat()">
        <div class="bot-avatar-circle">
            <i class="fas fa-user-tie"></i>
        </div>
    </div>
    
    <div class="chat-win" id="chatWin">
        <div class="chat-header"><span>🤵 مستشار السوق الكبير</span><i class="fas fa-times" onclick="toggleChat()" style="cursor:pointer;"></i></div>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="اسأل خبير السوق...">
            <button onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- 💳 شريط الأزرار السفلي الثابت والمدمج بالكامل -->
    <div class="fixed-bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i><span>الرئيسية</span>
        </div>
        <div class="nav-item" onclick="alert('صفحة الرسائل قريباً')">
            <i class="fas fa-envelope"></i><span>الرسائل</span>
        </div>
        <div class="nav-item" onclick="window.location.href='account.html'">
            <i class="fas fa-user-circle"></i><span>حسابي</span>
        </div>
        <div class="nav-item" onclick="logout()" style="color: #ff6b6b;">
            <i class="fas fa-power-off" style="color: #ff6b6b;"></i><span>خروج</span>
        </div>
    </div>

    <script>
        const storeData = {
            "أثاث منزلي": { icon: "fa-couch", class: "btn-home", ad: {t:"مفروشات الفخامة", d:"أطقم جلوس تركية ملكية بضمان معتمد لدى السوق الكبير."}, items:[{n:"طقم جلوس VIP", p:"1,200,000", i:"🛋️"}] },
            "أثاث مكتبي": { icon: "fa-chair", class: "btn-office", ad: {t:"مكتبة النيل", d:"كراسي طبية ومكاتب فاخرة للمديرين والشركات."}, items:[{n:"كرسي مدير طبي", p:"185,000", i:"💺"}] },
            "أواني منزلية": { icon: "fa-blender", class: "btn-kitchen", ad: {t:"عالم المطبخ", d:"أطقم حلل جرانيت وسيراميك أصلية 100%."}, items:[{n:"طقم جرانيت كوري", p:"145,000", i:"🍲"}] },
            "سجادات": { icon: "fa-scroll", class: "btn-rugs", ad: {t:"سجاد الشرق الفاخر", d:"سجاد صوف وحرير بنقشات تركية مميزة وصناعة متينة."}, items:[{n:"سجادة تركية 3*4", p:"210,000", i:"🧶"}] },
            "زينة و ديكور": { icon: "fa-lightbulb", class: "btn-decor", ad: {t:"عالم الديكور", d:"لوحات جدارية مضيئة وفازات كريستال فخمة للصالونات."}, items:[{n:"لوحة مودرن", p:"45,000", i:"🖼️"}] },
            "منتجات حديديه": { icon: "fa-tools", class: "btn-iron", ad: {t:"أعمال حدادة كبرى", d:"أبواب ليزر، نوافذ، وأسرة حديد بجودة متناهية ضد الصدأ."}, items:[{n:"سرير حديد دبل", p:"120,000", i:"⚙️"}] },
            "منتجات بلاستيك": { icon: "fa-box", class: "btn-plastic", ad: {t:"بلاستيكيات متميزة", d:"كراسي وطاولات بلاستيك متينة لكافة الاستخدامات والحدائق."}, items:[{n:"طقم كراسي (4)", p:"65,000", i:"🥤"}] },
            "صناعات شعبيه": { icon: "fa-fire", class: "btn-folk", ad: {t:"صناعات تراثية أصيلة ✨", d:"بروش، هبابات، ومنتجات سعف يدوية ممتازة للبيوت السودانية."}, items:[{n:"برش سعف فاخر", p:"15,000", i:"🏺"}] },
            "صناعات جلديه": { icon: "fa-shoe-prints", class: "btn-leather", ad: {t:"مصنوعات الجلود الطبيعية", d:"مراكيب جلد أصلية، حقائب، ومصنوعات جلدية يدوية 100%."}, items:[{n:"مركوب جلد فاخر", p:"55,000", i:"👞"}] }
        };

        const smartResponses = {
            "حديد": "أبشر يا هندسة، عندنا في السوق الكبير أفضل أبواب الليزر والأسرة الحديدية المتينة بأسعار منافسة.",
            "جلد": "المصنوعات الجلدية في السوق الكبير شغل يدوي ممتاز من جلود طبيعية 100% (مراكيب وشنط فخمة).",
            "سعر": "الأسعار حالياً مستقرة ومنافسة جداً في المتجر، وبنوفر ليك تخفيضات خاصة عند طلب كميات كبيرة.",
            "توصيل": "التوصيل متوفر وسريع لكافة الأحياء والمناطق، وبشحن مأمون.",
            "بلاستيك": "متوفر عندنا كراسي وطاولات بلاستيك متينة للماركات المحلية والجمهورية، أصلية وتتحمل الحرارة."
        };

        const categories = ["الكل", ...Object.keys(storeData)];
        let currentCat = "الكل", adIdx = 0;

        function toggleSidebar() {
            const side = document.getElementById('sidebar');
            side.classList.toggle('active');
            document.getElementById('overlay').style.display = side.classList.contains('active') ? 'block' : 'none';
        }

        function updatePage(cat) {
            currentCat = cat;
            renderChips();
            renderItems();
            renderAds(cat);
            renderSidebar();
            if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar();

            setTimeout(() => {
                const activeChip = document.querySelector(`.chip.active`);
                if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }, 50);
        }

        function renderSidebar() {
            document.getElementById('sidebarMenu').innerHTML = categories.map(c => {
                const isSelected = currentCat === c;
                const iconClass = c === 'الكل' ? 'fa-th-large' : storeData[c].icon;
                return `
                    <div class="sidebar-item ${isSelected ? 'active' : ''}" onclick="updatePage('${c}')">
                        <div class="sidebar-item-right">
                            <i class="fas ${iconClass} item-icon"></i>
                            <span>أجهزة ${c}</span>
                        </div>
                        <i class="fas fa-angle-left arrow-icon"></i>
                    </div>`;
            }).join('');
        }

        function renderChips() {
            document.getElementById('brandStrip').innerHTML = categories.map(c => {
                let colorClass = c === 'الكل' ? 'btn-all' : storeData[c].class;
                return `<div class="chip ${colorClass} ${currentCat === c ? 'active' : ''}" onclick="updatePage('${c}')">${c}</div>`;
            }).join('');
        }

        function renderItems() {
            let items = [];
            if(currentCat === 'الكل') { Object.values(storeData).forEach(d => items = [...items, ...d.items]); }
            else { items = storeData[currentCat]?.items || []; }
            
            const grid = document.getElementById('mainGrid');
            if(items.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align:center; padding:40px; color:#555; font-weight:700; font-size:0.8rem;">تشكيلات جديدة قريباً بهذا القسم 🛒</div>`;
            } else {
                grid.innerHTML = items.map(item => `
                    <div class="card">
                        <span class="emoji">${item.i}</span>
                        <h4>${item.n}</h4>
                        <div class="price">ج.س ${item.p}</div>
                        <a href="https://wa.me/249xxxxxxx" class="order-btn"><i class="fab fa-whatsapp"></i> اطلب الآن</a>
                    </div>
                `).join('');
            }
        }
