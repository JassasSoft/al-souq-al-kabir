<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0a14">
<title>الأقسام والبحث | السوق الكبير</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="shell.css">
<style>.field select{flex:none;width:auto;color:var(--gold-soft);font-size:.85rem}.field input{padding-inline-end:6px}</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="back" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
  <h1 id="title">الأقسام والبحث</h1>
  <button class="ib" onclick="toggleSidebar()" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
</header>
<main class="wrap">
  <form class="field" id="sf" role="search">
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    <input id="q" type="search" placeholder="ابحث في الإعلانات…" enterkeyhint="search" aria-label="بحث" autocomplete="off">
    <select id="sort" aria-label="الترتيب"><option value="new">الأحدث</option><option value="lo">الأقل سعرًا</option><option value="hi">الأعلى سعرًا</option></select>
  </form>
  <div class="chips" id="cats" role="tablist" aria-label="الأقسام"></div>
  <div class="chips" id="subs" hidden></div>
  <div class="chips" id="geoRow"></div>
  <div class="grid" id="grid" aria-busy="true"></div>
  <div class="state" id="empty" hidden><i class="fa-regular fa-folder-open"></i><p id="emptyMsg">لا توجد إعلانات مطابقة.</p><a class="btn" href="add-product.html">أضف إعلانًا</a></div>
  <div style="text-align:center;margin:18px 0"><button class="btn ghost" id="more" type="button" hidden>عرض المزيد</button></div>
</main>
<script type="module">
import { firebaseApp as app } from './auth.js';
import { DB_URL, CATS } from './geo.js';
import { getDatabase, ref, query, orderByChild, equalTo, limitToLast, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
const db = getDatabase(app, DB_URL), $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
let cat = CATS[P.get('cat')] ? P.get('cat') : '', sub = '', N = 60, all = [], hasMore = false, unsub = null, prem = new Set();
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const city = P.get('city') || lsGet('filteredCity'), state = P.get('state') || lsGet('filteredState');
let useGeo = !!(P.get('city') && P.get('city') !== '') && P.get('geo') !== '0';
$('q').value = (P.get('q') || '').slice(0, 80);

const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const chip = (label, on, fn) => { const b = el('button', 'chip' + (on ? ' on' : ''), label); b.type = 'button'; b.onclick = fn; return b; };
function card(id, a, p) {
  const c = el('a', 'card' + (p ? ' prem' : '')); c.href = 'ad.html?id=' + encodeURIComponent(id);
  const im = el('img', 'ph'); im.loading = 'lazy'; im.decoding = 'async'; im.alt = '';
  const s = Array.isArray(a.images) ? a.images[0] : ''; if (typeof s === 'string' && /^https:\/\//.test(s)) im.src = s;
  const m = el('div', 'meta');
  m.append(el('div', 't', String(a.description || '').slice(0, 70)), el('div', 'p', isFinite(a.price) ? Number(a.price).toLocaleString('en-US') + ' ج.س' : ''), el('div', 'loc', [a.city, a.state].filter(Boolean).join(' - ')));
  c.append(im, m); if (p) c.append(el('span', 'badge', 'مميز')); return c;
}
function skeleton() { const g = $('grid'); g.replaceChildren(); g.setAttribute('aria-busy', 'true'); for (let i = 0; i < 6; i++) { const c = el('div', 'card'); c.append(el('div', 'ph skel'), Object.assign(el('div', 'meta'), { innerHTML: '<div class="skel" style="height:14px;width:80%"></div><div class="skel" style="height:14px;width:40%;margin-top:8px"></div>' })); g.append(c); } }

function drawCats() {
  const box = $('cats'); box.replaceChildren(chip('الكل', !cat, () => pick('')));
  Object.keys(CATS).forEach(k => box.append(chip(CATS[k], cat === k, () => pick(k))));
  const t = cat ? CATS[cat] : ($('q').value ? 'نتائج البحث' : 'الأقسام والبحث'); $('title').textContent = t; document.title = t + ' | السوق الكبير';
}
function pick(k) { cat = k; sub = ''; history.replaceState(null, '', 'category.html' + (k ? '?cat=' + k : '')); drawCats(); load(); }
function drawGeo() {
  const r = $('geoRow'); r.replaceChildren();
  if (city) r.append(chip((useGeo ? '📍 ' + city : 'كل السودان'), useGeo, () => { useGeo = !useGeo; drawGeo(); render(); }));
}
function view() {
  const q = $('q').value.trim().toLowerCase();
  let list = all.filter(([, a]) => {
    if (useGeo && city && a.city !== city) return false;
    if (sub && a.sub_category !== sub) return false;
    if (q && !(String(a.description || '') + ' ' + (a.city || '') + ' ' + (a.state || '') + ' ' + (a.sub_category || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  const s = $('sort').value, ts = a => a.timestamp || 0, pr = a => Number(a.price) || 0;
  list.sort((x, y) => s === 'lo' ? pr(x[1]) - pr(y[1]) : s === 'hi' ? pr(y[1]) - pr(x[1]) : ((prem.has(y[0]) ? 1 : 0) - (prem.has(x[0]) ? 1 : 0)) || ts(y[1]) - ts(x[1]));
  return list;
}
function render() {
  const g = $('grid'), list = view(); g.replaceChildren(); g.setAttribute('aria-busy', 'false');
  list.forEach(([id, a]) => g.append(card(id, a, prem.has(id))));
  $('empty').hidden = list.length > 0; $('more').hidden = !hasMore;
  $('emptyMsg').textContent = useGeo && city ? 'لا توجد إعلانات في ' + city + ' حاليًا. جرّب "كل السودان".' : 'لا توجد إعلانات مطابقة.';
  const subs = [...new Set(all.map(([, a]) => a.sub_category).filter(Boolean))].slice(0, 20), sb = $('subs');
  sb.hidden = !(cat && subs.length > 1); sb.replaceChildren();
  if (!sb.hidden) { sb.append(chip('كل الأنواع', !sub, () => { sub = ''; render(); })); subs.forEach(s2 => sb.append(chip(s2, sub === s2, () => { sub = s2; render(); }))); }
}
function load() {
  skeleton(); if (unsub) unsub();
  const base = cat ? query(ref(db, 'ads'), orderByChild('category_id'), equalTo(cat), limitToLast(N)) : query(ref(db, 'ads'), orderByChild('timestamp'), limitToLast(N));
  unsub = onValue(base, snap => { all = []; snap.forEach(c => { all.push([c.key, c.val()]); }); hasMore = all.length >= N; render(); },
    () => { $('grid').replaceChildren(); $('emptyMsg').textContent = 'تعذر تحميل الإعلانات. تحقق من الاتصال.'; $('empty').hidden = false; });
}
onValue(query(ref(db, 'premium_ads'), limitToLast(50)), s => { prem = new Set(); s.forEach(c => { const v = c.val(); if (v && v.until > Date.now()) prem.add(c.key); }); if (all.length) render(); }, () => {});
let t; $('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { drawCats(); render(); }, 180); });
$('sf').addEventListener('submit', e => { e.preventDefault(); $('q').blur(); });
$('sort').onchange = render;
$('more').onclick = () => { N += 60; load(); };
$('back').onclick = () => history.length > 1 ? history.back() : location.href = 'index.html';
drawCats(); drawGeo(); load();
</script>
<script src="app.js" defer></script>
<script src="shell.js" defer></script>
</body>
</html>
