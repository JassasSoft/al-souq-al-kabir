<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f0a14"><title>السوق الكبير</title>
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#2a1740,#0f0a14 62%);overflow:hidden}
.s{text-align:center}
.s img{width:min(78vw,320px);height:auto;animation:in 1s cubic-bezier(.22,.8,.3,1) both;filter:drop-shadow(0 10px 34px rgba(242,184,75,.35))}
@keyframes in{from{opacity:0;transform:scale(.82) translateY(10px)}to{opacity:1;transform:none}}
.bar{width:120px;height:3px;margin:26px auto 0;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7b3fe4,#f2b84b);transform-origin:right;animation:fill 1.7s ease-in-out both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style></head>
<body><div class="s"><img src="logo-full.webp" alt="السوق الكبير" width="320" height="292"><div class="bar"><i></i></div></div>
<script>setTimeout(function(){location.replace('index.html')},1900)</script></body></html>
