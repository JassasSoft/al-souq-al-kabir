<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز الخدمات - السايدبار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f0214;
            --card-bg: #190924;
            --gold-primary: #ffbd59;
            --gold-glow: rgba(255, 189, 89, 0.25);
            --border-color: rgba(255, 189, 89, 0.2);
            --text-main: #ffffff;
            --text-sub: #b3a2c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 18px 14px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* الهيدر العلوي */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }

        .sidebar-title {
            color: var(--gold-primary);
            font-size: 1.15rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: rgba(255, 189, 89, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:active {
            transform: scale(0.92);
            background: rgba(255, 189, 89, 0.2);
        }

        /* كارت معلومات المستخدم */
        .user-profile-card {
            background: linear-gradient(135deg, rgba(255, 189, 89, 0.08) 0%, var(--card-bg) 100%);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            cursor: pointer;
        }

        .avatar-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gold-primary);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 0 12px var(--gold-glow);
            flex-shrink: 0;
        }

        .user-info h4 {
            font-size: 0.98rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .user-info p {
            font-size: 0.78rem;
            color: var(--gold-primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* قائمة الخانات */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-item.btn-add-ad {
            background: linear-gradient(90deg, rgba(255, 189, 89, 0.18) 0%, var(--card-bg) 100%);
            border-color: var(--gold-primary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-item i.icon {
            color: var(--gold-primary);
            font-size: 1.15rem;
            width: 24px;
            text-align: center;
        }

        .arrow-icon {
            color: #665275;
            font-size: 0.8rem;
        }

        .menu-item:active {
            transform: scale(0.98);
            background: rgba(255, 189, 89, 0.12);
        }

        /* الفوتر */
        .sidebar-footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .sidebar-footer span {
            color: var(--gold-primary);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div>
        <!-- الهيدر -->
        <div class="sidebar-header">
            <div class="sidebar-title">
                <i class="fas fa-sliders-h"></i> مركز الخدمات
            </div>
            <div class="close-btn" onclick="closeSidebar()">
                <i class="fas fa-times"></i>
            </div>
        </div>

        <!-- معلومات المستخدم -->
        <div class="user-profile-card" onclick="goToPage('profile.html')">
            <div class="avatar-box">
                <i class="fas fa-user"></i>
            </div>
            <div class="user-info">
                <h4>المطور محمد حبيب</h4>
                <p><i class="fas fa-check-circle"></i> تاجر معتمد • نيالا</p>
            </div>
        </div>

        <!-- قائمة الخانات والأزرار -->
        <div class="menu-list">
            <!-- 1. إضافة إعلان جديد (إحالة إلى add-product.html) -->
            <div class="menu-item btn-add-ad" onclick="goToPage('add-product.html')">
                <div class="menu-item-left">
                    <i class="fas fa-plus-circle icon"></i>
                    <span>إضافة إعلان جديد</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </div>

            <!-- 2. المحادثات المباشرة (إحالة إلى chat.html) -->
            <div class="menu-item" onclick="goToPage('chat.html')">
                <div class="menu-item-left">
                    <i class="fas fa-comments icon"></i>
                    <span>المحادثات المباشرة</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </div>

            <!-- 3. إعلاناتي المعروضة (إحالة إلى my-ads.html) -->
            <div class="menu-item" onclick="goToPage('my-ads.html')">
                <div class="menu-item-left">
                    <i class="fas fa-list-alt icon"></i>
                    <span>إعلاناتي المعروضة</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </div>

            <!-- 4. الفحص الجنائي للإشعارات (إحالة إلى bot.html) -->
            <div class="menu-item" onclick="goToPage('bot.html')">
                <div class="menu-item-left">
                    <i class="fas fa-shield-alt icon"></i>
                    <span>الفحص الجنائي للإشعارات</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </div>

            <!-- 5. خطط الباقات والاشتراكات -->
            <div class="menu-item" onclick="goToPage('packages.html')">
                <div class="menu-item-left">
                    <i class="fas fa-crown icon"></i>
                    <span>خطط الباقات والاشتراكات</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </div>

            <!-- 6. إعدادات الحساب والبروفايل -->
            <div class="menu-item" onclick="goToPage('profile.html')">
                <div class="menu-item-left">
                    <i class="fas fa-user-cog icon"></i>
                    <span>إعدادات الحساب والبروفايل</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <div class="sidebar-footer">
        التطبيق الإصدار <span>PRO 2.5</span> • تطوير المطور محمد حبيب
    </div>

    <script>
        // دالة التوجيه الشاملة لمنع فتح الصفحة داخل إطار السايدبار وإرغام الشاشة الرئيسية على الانتقال
        function goToPage(page) {
            try {
                if (window.top && window.top !== window) {
                    window.top.location.href = page;
                } else if (window.parent && window.parent !== window) {
                    window.parent.location.href = page;
                } else {
                    window.location.href = page;
                }
            } catch (e) {
                window.location.href = page;
            }
        }

        // دالة إغلاق السايدبار
        function closeSidebar() {
            if (window.parent && typeof window.parent.closeSidebarDrawer === 'function') {
                window.parent.closeSidebarDrawer();
            } else {
                const el = document.getElementById('sidebar') || document.getElementById('sidebarOverlay');
                if (el) el.style.display = 'none';
            }
        }
    </script>
</body><script src="shared.js"></script>
</html>
