<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f0a14">
<title>إدارة الإعلانات المميزة</title>
<style id="authGate">html{visibility:hidden}</style>
<script type="module">import{requireAuth}from'./auth.js';requireAuth({admin:true});</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0a14;color:#f5f1ea;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;padding:20px;max-width:560px;margin:auto}
h1{font-size:1.2rem;margin:10px 0 16px;color:#ffd98a}
.card{background:#1a1322;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:16px;margin-bottom:16px}
input,select,button{width:100%;font:inherit;font-size:16px;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#241a2f;color:#f5f1ea;margin-top:10px}
button{background:#f2b84b;color:#1b1200;font-weight:700;border:0;cursor:pointer}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:.85rem}
.item button{width:auto;margin:0;padding:8px 14px;background:#4a1a1f;color:#ffd7d7}
.item a{color:#ffd98a;overflow-wrap:anywhere}
small{color:#a79fb3}
</style>
</head>
<body>
<h1>الإعلانات المميزة</h1>
<div class="card">
  <small>الصق رابط الإعلان (ad.html?id=...) أو معرّفه، واختر المدة.</small>
  <input id="adRef" dir="ltr" placeholder="رابط الإعلان أو معرّفه">
  <select id="days"><option value="7">٧ أيام</option><option value="14">١٤ يومًا</option><option value="30">٣٠ يومًا</option></select>
  <button id="add" type="button">تفعيل التمييز</button>
  <small id="msg" role="status"></small>
</div>
<div class="card"><b>المميزة الآن</b><div id="list"><small>جارٍ التحميل...</small></div></div>
<script type="module">
import { firebaseApp as app } from './auth.js';
import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
const db = getDatabase(app, 'https://alsouq-alkabeer-2052c-default-rtdb.europe-west1.firebasedatabase.app');
const $ = id => document.getElementById(id);
$('add').onclick = async () => {
  const v = $('adRef').value.trim(), m = v.match(/[?&]id=([-\w]+)/), id = m ? m[1] : v;
  if (!/^[-\w]{5,60}$/.test(id)) { $('msg').textContent = 'رابط أو معرّف غير صحيح'; return; }
  try { await set(ref(db, 'premium_ads/' + id), { until: Date.now() + Number($('days').value) * 864e5 }); $('msg').textContent = 'تم التفعيل'; $('adRef').value = ''; }
  catch (e) { $('msg').textContent = 'تعذر الحفظ: تأكد من صلاحية المشرف'; }
};
onValue(ref(db, 'premium_ads'), s => {
  const box = $('list'); box.textContent = ''; let n = 0;
  s.forEach(c => {
    n++; const left = Math.ceil(((c.val().until || 0) - Date.now()) / 864e5);
    const row = document.createElement('div'); row.className = 'item';
    const a = document.createElement('a'); a.href = 'ad.html?id=' + encodeURIComponent(c.key); a.textContent = c.key + (left > 0 ? ' (' + left + ' يوم)' : ' (منتهي)');
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'إلغاء'; b.onclick = () => remove(ref(db, 'premium_ads/' + c.key));
    row.append(a, b); box.append(row);
  });
  if (!n) box.innerHTML = '<small>لا توجد إعلانات مميزة</small>';
}, () => { $('list').textContent = 'تعذر التحميل'; });
</script>
</body>
</html>
