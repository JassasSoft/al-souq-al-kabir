<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - السوق الكبير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffbd59; --bg: #0b0b0b; --card: #161616; }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            font-weight: 900; 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        .login-container { 
            width: 90%; max-width: 400px; background: var(--card); 
            padding: 40px 30px; border-radius: 30px; 
            border: 1px solid #333; text-align: center; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .back-circle { 
            position: absolute; top: 20px; right: 20px; width: 45px; height: 45px; 
            background: rgba(255,189,89,0.1); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--gold); text-decoration: none; border: 1px solid var(--gold);
            transition: 0.3s;
        }

        .logo-area { font-size: 2.8rem; font-weight: 900; color: var(--gold); margin-bottom: 5px; }
        .subtitle { color: #888; font-size: 1rem; margin-bottom: 30px; font-weight: 700; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; right: 18px; top: 18px; color: var(--gold); font-size: 1.2rem; }
        
        input { 
            width: 100%; padding: 18px 50px 18px 15px; background: #222; 
            border: 1px solid #444; border-radius: 15px; color: #fff; 
            font-family: 'Cairo'; font-weight: 900; box-sizing: border-box; 
            transition: 0.3s; font-size: 1rem;
        }
        input:focus { border-color: var(--gold); background: #282828; outline: none; }

        .btn-login { 
            width: 100%; padding: 18px; background: var(--gold); border: none; 
            border-radius: 15px; font-weight: 900; cursor: pointer; 
            font-size: 1.2rem; margin-top: 10px; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255,189,89,0.2);
            color: #000;
        }
        .btn-login:active { transform: scale(0.95); }

        .footer-links { margin-top: 25px; font-size: 0.95rem; }
        .footer-links a { color: var(--gold); text-decoration: none; font-weight: 900; margin: 0 5px; }
    </style>
</head>
<body>

    <div class="login-container">
        <a href="index.html" class="back-circle">
            <i class="fas fa-arrow-right"></i>
        </a>
        
        <!-- تم تحديث اسم التطبيق الثابت هنا -->
        <div class="logo-area">السوق الكبير</div>
        <p class="subtitle">منصتك التجارية المتكاملة بين يديك</p>

        <form onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="tel" placeholder="رقم الهاتف" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="btn-login">دخول المنصة</button>
        </form>

        <div class="footer-links">
            <span>ليس لديك حساب؟</span>
            <a href="register.html">إنشاء حساب جديد</a>
        </div>
    </div>

</body>
</html>
