<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0a14">
<title>حسابي | السوق الكبير</title>
<style id="authGate">html{visibility:hidden}</style>
<script type="module">import{requireAuth}from'./auth.js';requireAuth();</script>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="shell.css">
<style>
.hero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ffd98a,#f2b84b);color:#1b1200;display:grid;place-items:center;font-size:1.6rem;font-weight:700;flex:none}
.hero b{font-size:1.05rem;display:block}.hero small{color:var(--muted);word-break:break-all}
.pill{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:999px;background:var(--raise);color:var(--gold-soft);margin-top:4px;margin-inline-end:6px}
.pill.bad{background:#4a1a1f;color:#ffd7d7}
h2{font-size:1rem;margin:22px 0 10px;color:var(--gold-soft)}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tinfo{background:var(--surface);border:1px solid rgba(242,184,75,.28);border-radius:var(--r);padding:12px 14px;font-size:.86rem;line-height:1.8}
.tinfo b{display:block;color:var(--gold-soft)}.tinfo ul{list-style:none;margin-top:6px;color:var(--muted)}.tinfo li::before{content:"\2713 ";color:var(--gold)}
.links{display:grid;gap:8px}
.links a,.links button{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;color:var(--text);font:inherit;text-align:start;cursor:pointer;width:100%}
.links i{color:var(--gold);width:20px;text-align:center}
.links .danger{color:#ffd7d7;border-color:rgba(255,122,122,.3)}
@media (min-width:900px){.wrap{max-width:720px}}
</style>
</head>
<body>
<header class="bar">
  <button class="ib" id="back" aria-label="رجوع"><i class="fa-solid fa-arrow-right"></i></button>
  <h1>حسابي</h1>
  <button class="ib" onclick="toggleSidebar()" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
</header>
<main class="wrap">
  <section class="hero"><div class="av" id="av">؟</div><div><b id="name">...</b><small id="email"></small><div><span class="pill" id="typePill"></span><span class="pill" id="verPill"></span></div></div></section>
  <h2>بياناتي</h2>
  <form class="form" id="f" novalidate>
    <label class="field"><i class="fa-regular fa-user"></i><input id="fName" autocomplete="name" placeholder="الاسم الكامل" aria-label="الاسم الكامل"></label>
    <label class="field"><i class="fa-brands fa-whatsapp"></i><input id="fWa" type="tel" inputmode="tel" dir="ltr" placeholder="رقم واتساب للتواصل (اختياري)" aria-label="رقم واتساب"></label>
    <div class="two"><label class="field"><select id="fState" aria-label="الولاية"></select></label><label class="field"><select id="fCity" aria-label="المدينة"></select></label></div>
    <div class="seg" role="radiogroup" aria-label="نوع الحساب"><button type="button" class="chip" data-t="consumer" role="radio">مستفيد</button><button type="button" class="chip" data-t="merchant" role="radio">تاجر</button></div>
    <div class="tinfo" id="tinfo" aria-live="polite"></div>
    <button class="btn" id="save" type="submit">حفظ التغييرات</button>
    <p class="msg" id="msg" hidden role="status"></p>
  </form>
  <h2>الحساب</h2>
  <div class="links">
    <a href="my-ads.html"><i class="fa-solid fa-list"></i>إعلاناتي</a>
    <a href="trader-dashboard.html" id="lnkTrader" hidden><i class="fa-solid fa-store"></i>لوحة التاجر</a>
    <a href="plans.html" id="lnkPlans" hidden><i class="fa-solid fa-crown"></i>الباقات والاشتراكات</a>
    <button type="button" id="bVerify" hidden><i class="fa-regular fa-envelope"></i>إعادة إرسال رسالة تأكيد البريد</button>
    <button type="button" id="bReset"><i class="fa-solid fa-key"></i>إرسال رابط تغيير كلمة المرور</button>
    <button type="button" id="bOut"><i class="fa-solid fa-right-from-bracket"></i>تسجيل الخروج</button>
    <button type="button" id="bDel" class="danger"><i class="fa-regular fa-trash-can"></i>حذف الحساب نهائيًا</button>
  </div>
</main>
<script type="module">
import { firebaseApp as app, auth, onUser, getProfile, normalizePhone, signOutUser } from './auth.js';
import { SUDAN, DB_URL } from './geo.js';
import { getFirestore, doc, setDoc, deleteDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
import { updateProfile, sendEmailVerification, sendPasswordResetEmail, EmailAuthProvider, reauthenticateWithCredential, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getDatabase, ref, query, orderByChild, equalTo, get, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
const fs = getFirestore(app), rdb = getDatabase(app, DB_URL), $ = id => document.getElementById(id);
let me = null, type = 'consumer';
const INFO = {
  merchant: ['أنت المحرك الأساسي للمنصة!', 'كتاجر في السوق الكبير ستتمكن من إعلان وعرض بضائعك وخدماتك بأحدث الوسائل الذكية لضمان انتشار عروضك والوصول للمستهلكين فوراً وبكل سهولة.', ['انشر إعلاناتك في أقسام السوق مع صورك وسعرك', 'يتواصل معك العملاء مباشرة عبر واتساب أو الدردشة', 'لوحة تاجر لمتابعة إعلاناتك واشتراكك', 'باقات اشتراك وشارة تاجر معتمد وإعلانات مميزة']],
  consumer: ['مرحباً بك في عالم الفخامة!', 'بصفتك مستفيداً، صُممت المنصة خصيصاً لتلبية احتياجاتك الاستهلاكية واليومية بأسرع وأسهل الطرق وبأعلى مستويات الأمان التجاري.', ['تصفّح كل الأقسام وابحث حسب الولاية والمدينة', 'تواصل مع البائع مباشرة عبر واتساب أو الدردشة', 'أبلغ عن أي إعلان مخالف لحماية الجميع', 'يمكنك التحوّل إلى تاجر في أي وقت']]
};
const msg = (t, c) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + c; m.hidden = false; };
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
function paintType() {
  document.querySelectorAll('.seg .chip').forEach(b => { const on = b.dataset.t === type; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  const i = INFO[type], b = document.createElement('b'), p = document.createElement('p'), ul = document.createElement('ul');
  b.textContent = i[0]; p.textContent = i[1]; i[2].forEach(x => { const li = document.createElement('li'); li.textContent = x; ul.append(li); });
  $('tinfo').replaceChildren(b, p, ul);
  $('typePill').textContent = type === 'merchant' ? 'تاجر' : 'مستفيد';
  $('lnkTrader').hidden = $('lnkPlans').hidden = type !== 'merchant';
}
function fillCities(st, city) {
  const c = $('fCity'); c.replaceChildren();
  (SUDAN[st] || []).forEach(x => { const o = document.createElement('option'); o.value = o.textContent = x; c.append(o); });
  if (city && (SUDAN[st] || []).includes(city)) c.value = city;
}
Object.keys(SUDAN).forEach(s => { const o = document.createElement('option'); o.value = o.textContent = s; $('fState').append(o); });
$('fState').onchange = () => fillCities($('fState').value);
document.querySelectorAll('.seg .chip').forEach(b => b.onclick = () => { type = b.dataset.t; paintType(); });

onUser(async u => {
  if (!u || me) return; me = u;
  const p = (await getProfile(u.uid)) || {};
  type = p.type === 'merchant' ? 'merchant' : 'consumer';
  $('name').textContent = u.displayName || 'عضو'; $('av').textContent = (u.displayName || 'ع').trim().charAt(0); $('email').textContent = u.email || '';
  $('fName').value = u.displayName || p.name || ''; $('fWa').value = p.whatsapp || '';
  const st = p.state || lsGet('filteredState') || 'جنوب دارفور'; $('fState').value = SUDAN[st] ? st : 'جنوب دارفور'; fillCities($('fState').value, p.city || lsGet('filteredCity'));
  const vp = $('verPill'); vp.textContent = u.emailVerified ? 'البريد مؤكد' : 'البريد غير مؤكد'; vp.className = 'pill' + (u.emailVerified ? '' : ' bad'); $('bVerify').hidden = u.emailVerified;
  paintType();
});
$('f').addEventListener('submit', async e => {
  e.preventDefault(); if (!me) return;
  const name = $('fName').value.trim(), waRaw = $('fWa').value.trim();
  if (name.length < 2) return msg('أدخل اسمك الكامل', 'err');
  let wa = null; if (waRaw) { wa = normalizePhone(waRaw); if (!wa) return msg('رقم الواتساب غير صحيح. مثال: 0912345678', 'err'); }
  $('save').disabled = true;
  try {
    const d = { name, type, state: $('fState').value, city: $('fCity').value, whatsapp: wa || deleteField() };
    await setDoc(doc(fs, 'users', me.uid), d, { merge: true });
    await updateProfile(me, { displayName: name });
    try { localStorage.setItem('filteredState', d.state); localStorage.setItem('filteredCity', d.city); } catch (x) {}
    $('name').textContent = name; $('av').textContent = name.charAt(0); msg('تم حفظ بياناتك', 'ok');
  } catch (x) { msg('تعذر الحفظ. تحقق من الاتصال وحاول مرة أخرى', 'err'); }
  $('save').disabled = false;
});
$('bVerify').onclick = async () => { try { await sendEmailVerification(me); msg('تم إرسال رسالة التأكيد إلى بريدك', 'ok'); } catch (e) { msg('حاول لاحقًا (محاولات كثيرة)', 'err'); } };
$('bReset').onclick = async () => { try { await sendPasswordResetEmail(auth, me.email); msg('أرسلنا رابط تغيير كلمة المرور إلى بريدك', 'ok'); } catch (e) { msg('تعذر الإرسال، حاول لاحقًا', 'err'); } };
$('bOut').onclick = async () => { if (confirm('هل تريد تسجيل الخروج؟')) { await signOutUser(); location.replace('index.html'); } };
$('bDel').onclick = async () => {
  if (!confirm('سيتم حذف حسابك وإعلاناتك ومحادثاتك نهائيًا ولا يمكن التراجع. هل أنت متأكد؟')) return;
  const pass = prompt('للتأكيد أدخل كلمة مرورك'); if (!pass) return;
  try {
    await reauthenticateWithCredential(me, EmailAuthProvider.credential(me.email, pass));
    const snap = await get(query(ref(rdb, 'ads'), orderByChild('userId'), equalTo(me.uid))), jobs = [];
    snap.forEach(c => { jobs.push(remove(ref(rdb, 'ads_status/' + c.key)).catch(() => {}).then(() => remove(ref(rdb, 'ads/' + c.key)))); });
    await Promise.all(jobs);
    await remove(ref(rdb, 'chats/' + me.uid)).catch(() => {});
    await deleteDoc(doc(fs, 'users', me.uid)).catch(() => {});
    await deleteUser(me);
    try { localStorage.removeItem('user_device_id'); } catch (e) {}
    location.replace('index.html');
  } catch (e) { msg(e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential' ? 'كلمة المرور غير صحيحة' : 'تعذر حذف الحساب، حاول لاحقًا', 'err'); }
};
$('back').onclick = () => history.length > 1 ? history.back() : location.href = 'index.html';
</script>
<script src="app.js" defer></script>
<script src="shell.js" defer></script>
</body>
</html>
