<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0a14">
<title>لا يوجد اتصال | السوق الكبير</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f0a14;color:#f5f1ea;
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;text-align:center;line-height:1.7}
.box{max-width:320px}
.ring{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;border:3px solid #f2b84b;display:grid;place-items:center;font-size:2.2rem;color:#f2b84b}
h1{font-size:1.25rem;margin-bottom:8px}
p{color:#a79fb3;font-size:.95rem;margin-bottom:24px}
button{border:0;cursor:pointer;font:inherit;font-weight:700;background:#f2b84b;color:#1b1200;padding:13px 28px;border-radius:16px}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main class="box">
  <div class="ring" aria-hidden="true">!</div>
  <h1>الشبكة غير متاحة الآن</h1>
  <p>الصفحات اللي فتحتها قبل كده ما زالت متاحة. تأكد من الإنترنت وجرّب مرة ثانية.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</main>
</body>
</html>
